<template>
  <div class="games">
    <header class="games__header">
      <h1 class="games__title">Games - Week {weekNumber}</h1>
      <p class="games__note">
        Point spreads are with respect to the home team. Enter a positive
        spread if the home team is the underdog (getting points). Enter a
        negative spread if the home team is the favorite (giving points).
      </p>
    </header>

    <div class="games__controls">
      <lightning-combobox
        class="games__week-picker"
        label="Week"
        value={weekNumber}
        options={weekOptions}
        onchange={handleWeekChange}
      ></lightning-combobox>

      <div class="games__actions">
        <lightning-button
          label="Edit"
          onclick={handleEdit}
          disabled={isEditDisabled}
        ></lightning-button>
        <lightning-button
          label="Edit Locked Fields"
          variant="destructive-text"
          onclick={handleEditLocked}
          disabled={isEditLockedDisabled}
        ></lightning-button>
        <lightning-button
          label="Save"
          variant="brand"
          onclick={handleSave}
          disabled={isSaveDisabled}
        ></lightning-button>
        <lightning-button
          label="Quick Save"
          onclick={handleQuickSave}
          disabled={isSaveDisabled}
        ></lightning-button>
        <lightning-button
          label="Cancel"
          onclick={handleCancel}
          disabled={isCancelDisabled}
        ></lightning-button>
      </div>
    </div>

    <template if:true={showPrivilegedEditConfirm}>
      <div class="games__confirm" role="alertdialog">
        <p>
          You have chosen privileged edit mode. This will allow you to edit
          fields on locked games. Use this with caution.
        </p>
        <div class="games__confirm-actions">
          <lightning-button
            label="Cancel"
            onclick={handleCancelPrivilegedEdit}
          ></lightning-button>
          <lightning-button
            label="Yes, Edit Locked Games"
            variant="destructive"
            onclick={handleConfirmPrivilegedEdit}
          ></lightning-button>
        </div>
      </div>
    </template>

    <div class="games__add-controls">
      <lightning-button
        label="Add Single Game"
        onclick={handleAddSingleGame}
        disabled={isAddDisabled}
      ></lightning-button>
      <lightning-button
        label="Add Multiple Games"
        onclick={handleAddMultipleGames}
        disabled={isAddDisabled}
      ></lightning-button>
      <lightning-combobox
        class="games__num-to-add"
        label="Number of games"
        variant="label-hidden"
        value={numGamesToAdd}
        options={numGameOptions}
        onchange={handleNumGamesToAddChange}
        disabled={isNumGamesSelectDisabled}
      ></lightning-combobox>
    </div>

    <template if:true={loadError}>
      <div class="games__error" role="alert">{loadError}</div>
    </template>

    <template if:true={hasErrorLines}>
      <ul class="games__error" role="alert">
        <template for:each={errorLines} for:item="line">
          <li key={line}>{line}</li>
        </template>
      </ul>
    </template>

    <template if:true={isLoading}>
      <lightning-spinner
        alternative-text="Loading games"
        size="medium"
      ></lightning-spinner>
    </template>

    <template if:false={isLoading}>
      <template if:true={hasGames}>
        <div class="games__table-wrapper">
          <table class="games__table">
            <thead>
              <tr>
                <th scope="col">Game</th>
                <th scope="col">Start Time</th>
                <th scope="col">Home Team</th>
                <th scope="col">Home Score</th>
                <th scope="col">Spread</th>
                <th scope="col">Visiting Team</th>
                <th scope="col">Visiting Score</th>
                <th scope="col">Final</th>
                <template if:true={isViewMode}>
                  <th scope="col">Winner</th>
                </template>
                <template if:true={isEditLockedMode}>
                  <th scope="col"></th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template for:each={gameRows} for:item="row">
                <tr key={row.key}>
                  <td>{row.gameNumber}</td>
                  <td>
                    <template if:true={row.isStartTimeEditable}>
                      <c-date-time-input
                        label="Start Time"
                        variant="label-hidden"
                        value={row.game.Start_Time__c}
                        data-index={row.index}
                        data-field="Start_Time__c"
                        onchange={handleTableFieldChange}
                      ></c-date-time-input>
                    </template>
                    <template if:false={row.isStartTimeEditable}>
                      <lightning-formatted-date-time
                        value={row.game.Start_Time__c}
                        month="short"
                        day="2-digit"
                        hour="2-digit"
                        minute="2-digit"
                      ></lightning-formatted-date-time>
                    </template>
                  </td>
                  <td>
                    <template if:true={row.isHomeTeamEditable}>
                      <select
                        class="slds-select games__select"
                        data-index={row.index}
                        data-field="Home_Team__c"
                        onchange={handleTableFieldChange}
                      >
                        <template for:each={row.homeTeamOptions} for:item="option">
                          <option
                            key={option.value}
                            value={option.value}
                            selected={option.selected}
                            >{option.label}</option
                          >
                        </template>
                      </select>
                    </template>
                    <template if:false={row.isHomeTeamEditable}>
                      <span>{row.homeTeamName}</span>
                    </template>
                  </td>
                  <td>
                    <template if:true={row.isScoreEditable}>
                      <lightning-input
                        type="number"
                        label="Home Score"
                        variant="label-hidden"
                        class="games__score-input"
                        value={row.game.Home_Score__c}
                        data-index={row.index}
                        data-field="Home_Score__c"
                        onchange={handleTableFieldChange}
                      ></lightning-input>
                    </template>
                    <template if:false={row.isScoreEditable}>
                      <span>{row.game.Home_Score__c}</span>
                    </template>
                  </td>
                  <td>
                    <template if:true={row.isSpreadEditable}>
                      <lightning-input
                        type="number"
                        step="0.1"
                        label="Spread"
                        variant="label-hidden"
                        class="games__score-input"
                        value={row.game.Spread__c}
                        data-index={row.index}
                        data-field="Spread__c"
                        onchange={handleTableFieldChange}
                      ></lightning-input>
                    </template>
                    <template if:false={row.isSpreadEditable}>
                      <span>{row.game.Spread__c}</span>
                    </template>
                  </td>
                  <td>
                    <template if:true={row.isVisitingTeamEditable}>
                      <select
                        class="slds-select games__select"
                        data-index={row.index}
                        data-field="Visiting_Team__c"
                        onchange={handleTableFieldChange}
                      >
                        <template for:each={row.visitingTeamOptions} for:item="option">
                          <option
                            key={option.value}
                            value={option.value}
                            selected={option.selected}
                            >{option.label}</option
                          >
                        </template>
                      </select>
                    </template>
                    <template if:false={row.isVisitingTeamEditable}>
                      <span>{row.visitingTeamName}</span>
                    </template>
                  </td>
                  <td>
                    <template if:true={row.isScoreEditable}>
                      <lightning-input
                        type="number"
                        label="Visiting Score"
                        variant="label-hidden"
                        class="games__score-input"
                        value={row.game.Visiting_Score__c}
                        data-index={row.index}
                        data-field="Visiting_Score__c"
                        onchange={handleTableFieldChange}
                      ></lightning-input>
                    </template>
                    <template if:false={row.isScoreEditable}>
                      <span>{row.game.Visiting_Score__c}</span>
                    </template>
                  </td>
                  <td>
                    <lightning-input
                      type="checkbox"
                      label="Final"
                      variant="label-hidden"
                      checked={row.game.Final__c}
                      disabled={row.isFinalDisabled}
                      data-index={row.index}
                      data-field="Final__c"
                      onchange={handleTableFieldChange}
                    ></lightning-input>
                  </td>
                  <template if:true={isViewMode}>
                    <td>{row.game.Winner__c}</td>
                  </template>
                  <template if:true={isEditLockedMode}>
                    <td>
                      <lightning-button-icon
                        icon-name="utility:delete"
                        alternative-text="Delete game"
                        variant="border-filled"
                        disabled={row.isDeleteDisabled}
                        data-index={row.index}
                        onclick={handleTableDeleteClick}
                      ></lightning-button-icon>
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <div class="games__cards">
          <template for:each={gameRows} for:item="row">
            <c-game-edit-card
              key={row.key}
              row={row}
              team-options={teamOptions}
              onfieldchange={handleCardFieldChange}
              ondeletegame={handleCardDeleteGame}
            ></c-game-edit-card>
          </template>
        </div>
      </template>
      <template if:false={hasGames}>
        <div class="games__empty">No games found for this week.</div>
      </template>
    </template>
  </div>
</template>
